<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Icon for the browser tab -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" /> <!-- شما می‌توانید این را با لوگوی خودتان جایگزین کنید -->
    
    <!-- Responsive Design Metatag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO and Branding: Title of the website -->
    <title>شریف گلد | هنر جاودانه، برای شما</title>
    
    <!-- SEO: Description of the website -->
    <meta name="description" content="کالکشن‌های بی‌نظیر جواهرات طلا در شریف گلد. تلفیق هنر مدرن ایرانی با طراحی لوکس و سفارشی. قطعه رویایی خود را کشف یا خلق کنید." />

    <!-- Google Fonts: Cormorant Garamond (Luxury Serif) & Vazirmatn (Modern Persian Sans-serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    
  </head>
  <body>
    <!-- 
      This is the "mount point" for our React application.
      The entire website will be rendered inside this div by React.
    -->
    <div id="root"></div>
    
    <!-- 
      This script tag is the entry point for Vite.
      It will load and execute our main JavaScript file (main.jsx),
      which in turn starts the React application.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
